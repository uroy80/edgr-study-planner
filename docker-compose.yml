name: edgr-study-planner

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: sp-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-studyplanner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-studyplanner}
      POSTGRES_DB: ${POSTGRES_DB:-studyplanner}
    volumes:
      - sp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-studyplanner}']
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # Ollama runs NATIVELY on the host (Metal-accelerated) — not in Docker — so
  # the 8 GB Docker VM isn't a bottleneck and the M2 Pro GPU is used.
  # Install:  brew install --cask ollama  (then open it once)
  # The api reaches it at host.docker.internal:11434.

  api:
    build: .
    container_name: sp-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3100
      DATABASE_URL: postgres://${POSTGRES_USER:-studyplanner}:${POSTGRES_PASSWORD:-studyplanner}@postgres:5432/${POSTGRES_DB:-studyplanner}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-qwen3:8b}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      STUDY_MATERIALS_DIR: /app/data/study-materials
    ports:
      - '127.0.0.1:3100:3100'
    volumes:
      - sp_materials:/app/data/study-materials
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    restart: unless-stopped

volumes:
  sp_pgdata:
  sp_materials:
